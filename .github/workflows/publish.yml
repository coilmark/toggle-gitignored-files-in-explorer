name: Publish

on:
  release:
    types: [published]
  # Publish an existing release by hand, e.g. one tagged before this workflow existed.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.2.1)
        required: true

permissions:
  contents: write # attach the .vsix to the release
  id-token: write # OIDC sign-in to Microsoft Entra ID

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    # The Entra federated credential trusts only this environment.
    environment: marketplace
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches package.json version
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag $TAG does not match package.json version $expected"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # The ID to add as a member of the Marketplace publisher (one-time setup).
      - name: Show Azure DevOps identity
        run: az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv

      - name: Package
        run: npx @vscode/vsce@4.0.0 package --out extension.vsix

      - name: Publish to Visual Studio Marketplace
        run: npx @vscode/vsce@4.0.0 publish --packagePath extension.vsix --azure-credential

      - name: Attach .vsix to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="$(node -p 'const p = require("./package.json"); `${p.name}-${p.version}.vsix`')"
          mv extension.vsix "$name"
          gh release upload "$TAG" "$name" --clobber
