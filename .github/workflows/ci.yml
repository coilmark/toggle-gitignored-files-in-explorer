name: CI

on:
  # PR branches are covered by pull_request; also running on their pushes would duplicate every run.
  push:
    branches: [main]
  pull_request:

# Read-only token, independent of the repo's default workflow permissions.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run webpack
